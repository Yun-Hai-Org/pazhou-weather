AWSTemplateFormatVersion: "2010-09-09"
Description: EventBridge Scheduler -> Lambda -> GitHub repository_dispatch for Weather Report

Parameters:
  GitHubOwner:
    Type: String
    Default: Yun-Hai-Org
    Description: GitHub repository owner
  GitHubRepo:
    Type: String
    Default: pazhou-weather
    Description: GitHub repository name
  GitHubPat:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Fine-grained or classic PAT that can create repository_dispatch
  EventType:
    Type: String
    Default: weather-report
    Description: repository_dispatch event_type

Resources:
  GitHubPatSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/github-pat"
      Description: GitHub PAT for Weather Report repository_dispatch
      SecretString: !Ref GitHubPat

  DispatchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGitHubPatSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GitHubPatSecret

  DispatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-dispatch"
      Description: Trigger GitHub repository_dispatch for Weather Report
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DispatchLambdaRole.Arn
      Environment:
        Variables:
          GH_OWNER: !Ref GitHubOwner
          GH_REPO: !Ref GitHubRepo
          EVENT_TYPE: !Ref EventType
          SECRET_ARN: !Ref GitHubPatSecret
      Code:
        ZipFile: |
          import json
          import os
          import urllib.error
          import urllib.request

          import boto3

          sm = boto3.client("secretsmanager")


          def handler(event, context):
              owner = os.environ["GH_OWNER"]
              repo = os.environ["GH_REPO"]
              event_type = os.environ.get("EVENT_TYPE", "weather-report")
              secret_arn = os.environ["SECRET_ARN"]

              token = sm.get_secret_value(SecretId=secret_arn)["SecretString"].strip()
              if not token:
                  raise RuntimeError("GitHub PAT secret is empty")

              url = f"https://api.github.com/repos/{owner}/{repo}/dispatches"
              body = json.dumps({"event_type": event_type}).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "pazhou-weather-eventbridge-dispatcher",
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      status = resp.status
                      resp_body = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  resp_body = exc.read().decode("utf-8", errors="replace")
                  print(json.dumps({
                      "status": exc.code,
                      "owner": owner,
                      "repo": repo,
                      "eventType": event_type,
                      "body": resp_body[:500],
                  }))
                  raise RuntimeError(f"GitHub dispatch failed: {exc.code} {resp_body}") from exc

              print(json.dumps({
                  "status": status,
                  "owner": owner,
                  "repo": repo,
                  "eventType": event_type,
                  "body": resp_body[:500],
              }))
              return {"ok": True, "status": status}

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDispatchLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt DispatchFunction.Arn

  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-morning"
      Description: Weather Report morning slot (Beijing 06:05)
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(5 6 * * ? *)
      ScheduleExpressionTimezone: Asia/Shanghai
      State: ENABLED
      Target:
        Arn: !GetAtt DispatchFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  AfternoonSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-afternoon"
      Description: Weather Report afternoon slot (Beijing 15:05)
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(5 15 * * ? *)
      ScheduleExpressionTimezone: Asia/Shanghai
      State: ENABLED
      Target:
        Arn: !GetAtt DispatchFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

Outputs:
  DispatchFunctionName:
    Description: Lambda function name
    Value: !Ref DispatchFunction
  DispatchFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DispatchFunction.Arn
  GitHubPatSecretArn:
    Description: Secrets Manager ARN for GitHub PAT
    Value: !Ref GitHubPatSecret
  MorningScheduleName:
    Value: !Ref MorningSchedule
  AfternoonScheduleName:
    Value: !Ref AfternoonSchedule
