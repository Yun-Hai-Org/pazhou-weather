name: Notify WeCom
description: Send markdown message to WeCom group bot. Requires WECOM_WEBHOOK_URL env var (full webhook URL).

inputs:
  title:
    description: Message title (e.g. "🚀 CI 开始" / "✅ CI 完成" / "❌ CI 失败").
    required: true
  status:
    description: Status string (started / success / failure).
    required: true
  extra:
    description: Extra markdown lines to append to the message body.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send WeCom notification
      if: ${{ env.WECOM_WEBHOOK_URL != '' }}
      shell: bash
      env:
        WECOM_WEBHOOK_URL: ${{ env.WECOM_WEBHOOK_URL }}
        TITLE: ${{ inputs.title }}
        STATUS: ${{ inputs.status }}
        EXTRA: ${{ inputs.extra }}
      run: |
        set -euo pipefail

        REPO="$GITHUB_REPOSITORY"
        BRANCH="${GITHUB_REF#refs/heads/}"
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          BRANCH="${GITHUB_HEAD_REF:-$BRANCH}"
        fi
        ACTOR="$GITHUB_ACTOR"
        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        EVENT="$GITHUB_EVENT_NAME"

        case "$STATUS" in
          success) STATUS_ICON="✅" ;;
          failure) STATUS_ICON="❌" ;;
          started) STATUS_ICON="🚀" ;;
          *) STATUS_ICON="ℹ️" ;;
        esac

        case "$EVENT" in
          pull_request) EVENT_CN="Pull Request" ;;
          push) EVENT_CN="Push" ;;
          workflow_dispatch) EVENT_CN="手动触发" ;;
          schedule) EVENT_CN="定时任务" ;;
          repository_dispatch) EVENT_CN="外部调度" ;;
          *) EVENT_CN="$EVENT" ;;
        esac

        if [ "$STATUS" = "failure" ]; then
          STATUS_COLOR="warning"
        else
          STATUS_COLOR="info"
        fi

        {
          printf '%s\n' "$TITLE"
          printf '> \n'
          printf '> 📦 仓库　　 %s \n' "$REPO"
          printf '> 🌿 分支　　 %s \n' "$BRANCH"
          printf '> 👤 触发者　%s\n' "$ACTOR"
          printf '> ⚙️ 事件　　%s\n' "$EVENT_CN"
          printf '> %s 状态　　 %s \n' "$STATUS_ICON" "$STATUS_COLOR" "$STATUS"
          if [ -n "$EXTRA" ]; then
            printf '> \n'
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                clean="${line#> }"
                clean="${clean#>}"
                printf '> %s\n' "$clean"
              else
                printf '> \n'
              fi
            done <<< "$EXTRA"
          fi
          printf '> \n'
          printf '> 👉 [查看 CI 详情](%s)\n' "$RUN_URL"
        } > /tmp/wecom_content.txt

        CONTENT=$(cat /tmp/wecom_content.txt)
        PAYLOAD=$(jq -nc --arg content "$CONTENT" '{msgtype:"markdown",markdown:{content:$content}}')

        RESPONSE=$(curl -sS -X POST \
          "$WECOM_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "$PAYLOAD" 2>/dev/null || echo '{"errcode":-1,"errmsg":"curl network error"}')

        ERRMSG=$(echo "$RESPONSE" | jq -r '.errmsg // empty' 2>/dev/null || echo "parse error")
        ERRCODE=$(echo "$RESPONSE" | jq -r '.errcode // empty' 2>/dev/null || echo "-1")
        if [ "$ERRCODE" != "0" ] && [ -n "$ERRCODE" ]; then
          echo "::warning::WeCom webhook returned errcode=${ERRCODE} errmsg=${ERRMSG}"
          echo "Response: $RESPONSE"
        else
          echo "WeCom notification sent: ${TITLE}"
        fi

        exit 0

    - name: Skip when WECOM_WEBHOOK_URL unset
      if: ${{ env.WECOM_WEBHOOK_URL == '' }}
      shell: bash
      run: echo "::warning::WECOM_WEBHOOK_URL not set, skipping WeCom notification"
