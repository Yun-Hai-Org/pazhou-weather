name: Weather Report

on:
  repository_dispatch:
    types: [weather-report]
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Build detail page and assets (no send)
        env:
          WECOM_SKIP_SEND: "1"
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          WECOM_SKIP_PROD_WEEKENDS: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
          WECOM_WEBHOOK_URL_PROD: ${{ secrets.WECOM_WEBHOOK_URL_PROD }}
          WECOM_WEBHOOK_URL_DEV: ${{ secrets.WECOM_WEBHOOK_URL_DEV }}
          PAGES_BASE_URL: ${{ vars.CF_PAGES_URL }}
          IMAGE_GEN_API_BASE: ${{ secrets.IMAGE_GEN_API_BASE }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          IMAGE_GEN_MODEL: ${{ vars.IMAGE_GEN_MODEL || 'dall-e-3' }}
        run: uv run python main.py
      - name: Deploy to Cloudflare Pages
        if: always()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT }}
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Send WeCom weather card
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          APP_ENV: ${{ vars.APP_ENV || 'dev' }}
          WECOM_SKIP_PROD_WEEKENDS: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
          WECOM_WEBHOOK_URL_PROD: ${{ secrets.WECOM_WEBHOOK_URL_PROD }}
          WECOM_WEBHOOK_URL_DEV: ${{ secrets.WECOM_WEBHOOK_URL_DEV }}
          PAGES_BASE_URL: ${{ vars.CF_PAGES_URL }}
          CARD_IMAGE_CDN_BASE: ${{ vars.CF_PAGES_URL }}/assets/card
          IMAGE_GEN_API_BASE: ${{ secrets.IMAGE_GEN_API_BASE }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          IMAGE_GEN_MODEL: ${{ vars.IMAGE_GEN_MODEL || 'dall-e-3' }}
        run: uv run python main.py
