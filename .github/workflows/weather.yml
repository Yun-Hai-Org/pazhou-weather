name: Weather Report

on:
  repository_dispatch:
    types: [weather-report]
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      # PAGES_BASE_URL / deploy use org vars CF_PAGES_URL and CF_PAGES_PROJECT (and CF secrets).
      - name: Send weather report and build detail page
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          PAGES_BASE_URL: ${{ vars.CF_PAGES_URL }}
          CARD_IMAGE_CDN_BASE: https://cdn.jsdelivr.net/gh/pr9898/20260709--@feat/wecom-template-card-detail-page/assets/card
        run: uv run python main.py
      - name: Deploy to Cloudflare Pages
        if: always()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT }}
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
