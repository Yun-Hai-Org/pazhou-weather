name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/hono-do-alarm/package-lock.json
      - name: Install dependencies
        working-directory: poc/hono-do-alarm
        run: npm ci
      - name: Typecheck
        working-directory: poc/hono-do-alarm
        run: npm run typecheck
      - name: Wrangler deploy dry run
        working-directory: poc/hono-do-alarm
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
